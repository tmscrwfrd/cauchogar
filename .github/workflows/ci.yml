name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Cancela runs en curso del mismo PR/rama cuando llega un push nuevo
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Sintaxis JS
        run: |
          node --check app.js
          node --check data.js

      - name: Validar HTML (W3C Nu)
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          blacklist: cauchogar
          css: false

      - name: Lint CSS (stylelint)
        run: npx --yes stylelint@16 "**/*.css"

      - name: Links rotos (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,403,429
            layout.html
          fail: true
