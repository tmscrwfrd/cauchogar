version: 2
updates:
  # Mantiene actualizadas las GitHub Actions usadas en los workflows del CI
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
    # Junta todos los bumps de Actions en una sola PR en vez de una por Action
    groups:
      github-actions:
        patterns:
          - "*"
